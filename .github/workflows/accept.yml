# Checks a result posted as an issue and, if it passes, adds it to board.json.
# Whatever the answer, the issue then holds the result and nothing else: its
# title and body are rewritten to the result (or emptied, when it holds none),
# and it is closed and locked.
#
# The issue's title and body are written by whoever opened it. They never
# appear in a shell script here: accept.py reads them from the event file, and
# the only thing the shell gets from the event is the issue number. What the
# issue becomes is written by accept.py to a file that the API is handed.
#
# No concurrency group: GitHub keeps one waiting run per group and cancels the
# rest, which would drop results posted close together. Runs that race instead
# retry their push from the newest board, rebuilding board.json there.

name: Accept result

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  accept:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # First, so nobody can add a comment while the result is checked. A run
      # that is run again finds the issue locked already.
      - name: Lock the conversation
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .locked)" != "true" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$ISSUE/lock" -f lock_reason=resolved --silent
          fi

      - name: Check out the newest board
        uses: actions/checkout@v7
        with:
          # The branch tip rather than the commit the event saw, so a run that
          # waited in the queue builds on the results accepted before it.
          ref: ${{ github.ref_name }}

      # Asks Hugging Face about the model file too. When Hugging Face does not
      # answer, this fails rather than turn a good result away.
      - name: Check the result
        id: check
        run: |
          python3 scripts/accept.py accept "$GITHUB_EVENT_PATH" . "$RUNNER_TEMP/accept"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/accept/decision.json")
          case "$status" in
            accepted | rejected | other) echo "status=$status" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected status." >&2; exit 1 ;;
          esac

      # board.json is generated, so a retry starts again from the branch tip and
      # rebuilds it there, rather than rebasing one board.json onto another.
      - name: Commit and push
        if: steps.check.outputs.status == 'accepted'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "results/$ISSUE.json" "$RUNNER_TEMP/result.json"
          for attempt in 1 2 3 4 5; do
            git add results board.json
            if git diff --cached --quiet; then
              echo "Nothing new to commit."
              exit 0
            fi
            git commit -q -m "Add result #$ISSUE"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "The push was refused, so starting again from the newest board."
            sleep $((attempt * 3))
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/result.json" "results/$ISSUE.json"
            python3 scripts/accept.py rebuild .
          done
          echo "Could not push after 5 tries." >&2
          exit 1

      - name: Comment
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/accept/comment.md"

      - name: Label
        if: steps.check.outputs.status == 'rejected'
        run: |
          gh label create "not accepted" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The posted result did not pass the checks" || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "not accepted" \
            || echo "Could not add the label." >&2

      # The title and body become the result alone, or nothing, and the issue
      # is closed: completed for a result on the board, not planned otherwise.
      - name: Rewrite and close
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --input "$RUNNER_TEMP/accept/issue.json" --silent

  # Locking stops comments, not necessarily edits by the issue's author. An
  # edit to an issue the board has closed is undone, and one made while the
  # accept run is still deciding is overwritten by that run.
  restore:
    if: github.event.action == 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the newest board
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Put back what the board left
        run: |
          python3 scripts/accept.py restore "$GITHUB_EVENT_PATH" . "$RUNNER_TEMP/restore"
          if [ -f "$RUNNER_TEMP/restore/issue.json" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --input "$RUNNER_TEMP/restore/issue.json" --silent
          fi
